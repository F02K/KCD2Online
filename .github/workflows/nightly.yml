name: Nightly Build

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - config: Debug
            final: "NO"
          - config: RelWithDebInfo
            final: "YES"
    name: Validate ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git .cache/vcpkg
          git -C .cache/vcpkg checkout --detach 908da3a305a0a8028d9602ab241b433652b3df69
          .cache/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build-${{ matrix.config }} -G Ninja
          -D CMAKE_BUILD_TYPE=${{ matrix.config }}
          -D FINAL=${{ matrix.final }}
          -D BUILD_TESTING=ON
          -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.cache/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -D VCPKG_TARGET_TRIPLET=x64-windows-static
          -D VCPKG_OVERLAY_PORTS="${{ github.workspace }}/cmake_scripts/vcpkg/ports"

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build-${{ matrix.config }} --target KCD2OnlineRuntime KCD2OnlineServer KCD2OnlineSignatureAudit KCD2OnlineTests
          ctest --test-dir build-${{ matrix.config }} -C ${{ matrix.config }} -R "^KCD2Online" --output-on-failure

  build_nightly:
    needs: validate
    runs-on: windows-latest
    name: Build Nightly
    outputs:
      full_sha: ${{ steps.var.outputs.full_sha }}
      short_sha: ${{ steps.var.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git .cache/vcpkg
          git -C .cache/vcpkg checkout --detach 908da3a305a0a8028d9602ab241b433652b3df69
          .cache/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Generate CMake project
        run: cmake -D CMAKE_BUILD_TYPE=RelWithDebInfo -D FINAL=YES -D BUILD_TESTING=ON -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.cache/vcpkg/scripts/buildsystems/vcpkg.cmake" -D VCPKG_TARGET_TRIPLET=x64-windows-static -D VCPKG_OVERLAY_PORTS="${{ github.workspace }}/cmake_scripts/vcpkg/ports" -S. -Bbuild -G Ninja
        #run: cmake -D CMAKE_BUILD_TYPE=Debug -S. -Bbuild -G Ninja

      - name: Build 64bit release DLL
        shell: pwsh
        run: |
          cmake --build ./build --config RelWithDebInfo --target KCD2OnlineRuntime KCD2OnlineServer KCD2OnlineSignatureAudit KCD2OnlinePropertyCatalog KCD2OnlineTests --
          ctest --test-dir ./build -C RelWithDebInfo -R "^KCD2Online" --output-on-failure

      - name: Package release outputs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --requirement tools/build_tui/requirements.txt
          python tools/package_build.py --build-dir build --config RelWithDebInfo --output out/package/release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcd2o-release
          path: out/package/release
      - name: Generate Build Info
        id: var
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

  create_release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: build_nightly
    steps:
      - uses: actions/checkout@v3
  
      - name: Delete Existing Release
        id: delete_release
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "nightly";
      
            // List all releases and find the release by tag
            const releases = await github.rest.repos.listReleases({
              owner: owner,
              repo: repo,
            });
      
            const release = releases.data.find(release => release.tag_name === tag);
      
            // Check if the release exists and delete it
            if (release) {
              await github.rest.repos.deleteRelease({
                owner: owner,
                repo: repo,
                release_id: release.id,
              });
              console.log(`Deleted release with ID ${release.id}`);
            } else {
              console.log("No existing release to delete");
            }
      
            // Delete the tag
            try {
              await github.rest.git.deleteRef({
                owner: owner,
                repo: repo,
                ref: `tags/${tag}`,
              });
              console.log(`Deleted tag ${tag}`);
            } catch (error) {
              console.error(`Error deleting tag: ${error.message}`);
            }

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: kcd2o-release
          path: package

      - name: Echo build sha256
        id: build_sha
        shell: bash
        run: |
          sha256sum package/client/KCD2Online-Client-v*.zip package/server/KCD2Online-Server-v*.zip > sha256.checksum
          echo "build_sha=$(cat sha256.checksum)" >> $GITHUB_OUTPUT
          cat sha256.checksum

      - name: Nightly Release
        uses: softprops/action-gh-release@v1
        with:
          name: Nightly [${{ needs.build_nightly.outputs.short_sha }}]
          tag_name: nightly
          body: |
            **This release has been built by Github Actions**
            [Link to build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Client and server package SHA256:
            ```
            ${{ steps.build_sha.outputs.build_sha }}
            ```
            To verify the build SHA256 during the action, click the build link, go-to "Create Release", open the Echo build sha256 step and read the sha256.

            You can download the build artifacts, generate a SHA256 checksum and compare it with the below binary.
            Build artifacts ARE NOT automatically the same as release assets since release assets can be modified afterwards.

            Full Commit Hash:
            ```
            ${{ needs.build_nightly.outputs.full_sha }}
            ```
          files: |
            package/client/KCD2Online-Client-v*.zip
            package/server/KCD2Online-Server-v*.zip
            package/SHA256SUMS.txt
