syntax = "proto3";

package kcd2o.protocol;

enum MovementMode {
  MOVEMENT_MODE_IDLE = 0;
  MOVEMENT_MODE_WALK = 1;
  MOVEMENT_MODE_RUN = 2;
  MOVEMENT_MODE_SPRINT = 3;
}

enum AvatarStance {
  AVATAR_STANCE_RELAXED = 0;
  AVATAR_STANCE_READY = 1;
}

enum AvatarWeaponClass {
  AVATAR_WEAPON_CLASS_NONE = 0;
  AVATAR_WEAPON_CLASS_ONE_HANDED = 1;
  AVATAR_WEAPON_CLASS_TWO_HANDED = 2;
  AVATAR_WEAPON_CLASS_POLEARM = 3;
  AVATAR_WEAPON_CLASS_BOW = 4;
  AVATAR_WEAPON_CLASS_CROSSBOW = 5;
  // KCD2 models fists as virtual weapon class 12. It is not equivalent to
  // having no active weapon set.
  AVATAR_WEAPON_CLASS_UNARMED = 6;
}

enum AvatarWeaponSet {
  AVATAR_WEAPON_SET_NONE = 0;
  AVATAR_WEAPON_SET_PRIMARY = 1;
  AVATAR_WEAPON_SET_SECONDARY = 2;
  AVATAR_WEAPON_SET_OVERSIZED = 3;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_VERSION_MISMATCH = 1;
  REJECT_REASON_GAME_BUILD_MISMATCH = 2;
  REJECT_REASON_LEVEL_MISMATCH = 3;
  REJECT_REASON_AUTHENTICATION_FAILED = 4;
  REJECT_REASON_DUPLICATE_NAME = 5;
  REJECT_REASON_SERVER_FULL = 6;
  REJECT_REASON_MALFORMED_MESSAGE = 7;
  REJECT_REASON_CONTENT_MISMATCH = 8;
  REJECT_REASON_IDENTITY_REQUIRED = 9;
  REJECT_REASON_IDENTITY_IN_USE = 10;
  REJECT_REASON_SESSION_MISMATCH = 11;
  REJECT_REASON_BOOTSTRAP_FAILED = 12;
  REJECT_REASON_PROFILE_CONFLICT = 13;
}

enum BootstrapMode {
  BOOTSTRAP_MODE_WAIT = 0;
  BOOTSTRAP_MODE_INITIALIZE = 1;
  BOOTSTRAP_MODE_LOAD = 2;
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// Continuous presentation intent consumed by KCD2's native movement
// controller. World transforms remain authoritative recovery anchors; these
// values let the engine choose and blend its own locomotion animations.
message LocomotionState {
  Vec3 local_velocity = 1;
  Vec3 acceleration = 2;
  Vec3 facing_direction = 3;
  float speed = 4;
  float yaw_rate = 5;
  bool strafing = 6;
  bool ground_contact_known = 7;
  bool grounded = 8;
}

// Sequenced Mannequin presentation state. This is intentionally limited to
// non-combat one-shots such as jumps, gestures and interactions. Exact combat
// action replay requires a separate authoritative combat protocol.
message AnimationState {
  uint64 sequence = 1;
  string fragment = 2;
  uint64 started_at_ms = 3;
  bool active = 4;
  bool looped = 5;
}

message TransformState {
  Vec3 position = 1;
  Quaternion rotation = 2;
  Vec3 velocity = 3;
  uint64 sequence = 4;
  uint64 client_time_ms = 5;
  LocomotionState locomotion = 6;
  AnimationState animation = 7;
}

message AvatarEquipment {
  string definition_id = 1;
  string equipped_slot = 2;
}

message AvatarDescriptor {
  string archetype_id = 1;
  uint64 revision = 2;
  repeated AvatarEquipment equipment = 3;
  AvatarStance stance = 4;
  AvatarWeaponClass weapon_class = 5;
  bool weapon_drawn = 6;
  // The native weapon controller set which is currently drawn. NONE means
  // holstered; an empty drawn PRIMARY set resolves to UNARMED.
  AvatarWeaponSet active_weapon_set = 7;
  // These are observations of the native CombatActor. They are replicated for
  // remote presentation and diagnostics, never written back onto the owner.
  bool combat_mode = 8;
  bool active_in_combat = 9;
}

message AvatarPolicy {
  string default_archetype_id = 1;
  repeated string allowed_archetype_ids = 2;
}

enum PlayerActivityKind {
  PLAYER_ACTIVITY_KIND_NONE = 0;
  PLAYER_ACTIVITY_KIND_BLACKSMITHING = 1;
  PLAYER_ACTIVITY_KIND_SHARPENING = 2;
  PLAYER_ACTIVITY_KIND_ALCHEMY = 3;
}

message PlayerActivity {
  PlayerActivityKind kind = 1;
  uint64 station_guid = 2;
  uint64 session_id = 3;
  uint64 revision = 4;
  bool active = 5;
}

message PlayerSnapshot {
  uint64 player_id = 1;
  string display_name = 2;
  TransformState transform = 3;
  MovementMode movement_mode = 4;
  bool transform_valid = 5;
  bool connected = 6;
  AvatarDescriptor avatar = 7;
  PlayerActivity activity = 8;
  // Stable public identity assigned once by the server. Unlike player_id this
  // remains suitable for long-lived RP contracts and property assignments.
  string persistent_id = 9;
}

message ClientRuntimeCapabilities {
  uint64 features = 1;
  uint32 kcse_version = 2;
  uint32 game_version = 3;
  uint32 release_index = 4;
  uint64 runtime_epoch = 5;
  string address_library = 6;
  string address_library_distribution = 7;
  uint32 address_library_format = 8;
  uint32 address_library_entries = 9;
  string address_library_sha256 = 10;
}

message ClientHello {
  string version = 1;
  reserved 2;
  reserved "client_version";
  uint32 whgame_timestamp = 3;
  uint64 whgame_image_size = 4;
  string display_name = 5;
  string password = 6;
  string level_id = 7;
  string content_hash = 8;
  string resume_token = 9;
  ClientRuntimeCapabilities runtime = 10;
}

message ServerChallenge {
  string server_id = 1;
  uint64 required_runtime_features = 2;
  uint64 negotiated_runtime_features = 3;
}

message ClientAuthenticate {
  string identity_token = 1;
  string claim_code = 2;
  bool enroll = 3;
  string resume_token = 4;
}

message RpgValue {
  string id = 1;
  int32 level = 2;
  float progress = 3;
}

message InventoryItem {
  string instance_id = 1;
  string definition_id = 2;
  uint32 count = 3;
  float quality = 4;
  float condition = 5;
  optional string equipped_slot = 6;
}

enum QuickAccessSlotType {
  QUICK_ACCESS_SLOT_TYPE_WEAPON = 0;
  QUICK_ACCESS_SLOT_TYPE_CONSUMABLE = 1;
}

message QuickAccessSlot {
  uint32 outfit = 1;
  QuickAccessSlotType type = 2;
  uint32 slot = 3;
  string instance_id = 4;
}

message PlayerProfile {
  uint64 player_id = 1;
  uint64 revision = 2;
  string display_name = 3;
  string level_id = 4;
  TransformState last_transform = 5;
  bool transform_valid = 6;
  int64 money = 7;
  repeated RpgValue stats = 8;
  repeated RpgValue skills = 9;
  repeated InventoryItem inventory = 10;
  AvatarDescriptor avatar = 11;
  // Tenths of one Groschen, constrained to 0..9.
  uint32 money_subunits = 12;
  repeated QuickAccessSlot quick_access_slots = 13;
  // Server-generated UUIDv4. The authentication token remains private and is
  // deliberately not used as a public RP identity.
  string persistent_id = 14;
}

message EnvironmentState {
  uint64 revision = 1;
  // Authoritative time of day at server_time_ms, in the range [0, 24).
  double time_of_day_hours = 2;
  // In-game seconds advanced per real-world second. Zero pauses the cycle.
  float time_scale = 3;
  uint64 server_time_ms = 4;
  uint32 weather_id = 5;
  uint32 weather_transition_ms = 6;
  uint64 weather_revision = 7;
}

message ServerBootstrap {
  string server_id = 1;
  string session_id = 2;
  uint64 manifest_revision = 3;
  string level_id = 4;
  uint64 world_seed = 5;
  BootstrapMode mode = 6;
  TransformState spawn = 7;
  bool spawn_valid = 8;
  PlayerProfile profile = 9;
  string issued_identity_token = 10;
  uint32 timeout_seconds = 11;
  repeated WorldObjectState world_objects = 12;
  EnvironmentState environment = 13;
  repeated WorldItemState world_items = 14;
}

message ClientWorldReady {
  string session_id = 1;
  uint64 manifest_revision = 2;
  string level_id = 3;
  TransformState initial_spawn = 4;
  bool initialized_session = 5;
  AvatarDescriptor avatar = 6;
}

message ClientWorldFailed {
  string session_id = 1;
  string reason = 2;
}

message ClientProfileUpdate {
  uint64 base_revision = 1;
  PlayerProfile profile = 2;
}

message ProfileAccepted {
  uint64 revision = 1;
}

message ProfileRejected {
  uint64 authoritative_revision = 1;
  string reason = 2;
  PlayerProfile authoritative_profile = 3;
}

enum WorldObjectKind {
  WORLD_OBJECT_KIND_UNSPECIFIED = 0;
  WORLD_OBJECT_KIND_DOOR = 1;
  WORLD_OBJECT_KIND_CONTAINER = 2;
}

message WorldObjectState {
  uint64 entity_guid = 1;
  WorldObjectKind kind = 2;
  uint64 revision = 3;
  bool opened = 4;
  bool has_inventory = 5;
  repeated InventoryItem inventory = 6;
}

message ClientWorldObjectUpdate {
  uint64 base_revision = 1;
  WorldObjectState state = 2;
}

message WorldObjectAccepted {
  uint64 entity_guid = 1;
  uint64 revision = 2;
  // Present when the atomic container transaction also changed the player.
  PlayerProfile authoritative_profile = 3;
}

message WorldObjectRejected {
  WorldObjectState authoritative_state = 1;
  string reason = 2;
}

message WorldObjectUpdated {
  WorldObjectState state = 1;
}

message WorldItemState {
  string instance_id = 1;
  uint64 revision = 2;
  bool present = 3;
  InventoryItem item = 4;
  TransformState transform = 5;
}

message ClientWorldItemUpdate {
  uint64 base_revision = 1;
  WorldItemState state = 2;
  // Set when a newly created world instance was split from another stack.
  string source_instance_id = 3;
  // Zero means the complete source instance. Partial transfers must match the
  // world item's count and keep a non-empty source stack.
  uint32 transfer_count = 4;
}

message WorldItemAccepted {
  string instance_id = 1;
  uint64 revision = 2;
  // Present when the atomic drop/pickup also changed the player.
  PlayerProfile authoritative_profile = 3;
}

message WorldItemRejected {
  WorldItemState authoritative_state = 1;
  string reason = 2;
}

message WorldItemUpdated {
  WorldItemState state = 1;
}

message StoredWorldObjects {
  repeated WorldObjectState objects = 1;
}

message StoredWorldItems {
  repeated WorldItemState items = 1;
}

message StoredPlayerProfile {
  bytes identity_token_hash = 1;
  PlayerProfile profile = 2;
}

enum PropertyResourceKind {
  PROPERTY_RESOURCE_KIND_UNSPECIFIED = 0;
  PROPERTY_RESOURCE_KIND_DOOR = 1;
  PROPERTY_RESOURCE_KIND_CONTAINER = 2;
  PROPERTY_RESOURCE_KIND_BED = 3;
  PROPERTY_RESOURCE_KIND_WORKSTATION = 4;
}

message PropertyResource {
  uint64 entity_guid = 1;
  PropertyResourceKind kind = 2;
}

message PropertyDefinition {
  string property_id = 1;
  string level_id = 2;
  string anchor_guid = 3;
  string parent_property_id = 4;
  string inferred_name = 5;
  string source_path = 6;
  float discovery_confidence = 7;
  repeated PropertyResource resources = 8;
  // Preferred in-world point for a native Home marker. This is discovered
  // from the property's SchedulerHub (or its crime-area anchor as fallback).
  Vec3 marker_position = 9;
  uint64 marker_entity_guid = 10;
}

message PropertyCatalog {
  uint32 schema = 1;
  string level_id = 2;
  string content_fingerprint = 3;
  repeated PropertyDefinition properties = 4;
}

enum PropertyRole {
  PROPERTY_ROLE_UNSPECIFIED = 0;
  PROPERTY_ROLE_OWNER = 1;
  PROPERTY_ROLE_STEWARD = 2;
  PROPERTY_ROLE_RESIDENT = 3;
  PROPERTY_ROLE_EMPLOYEE = 4;
  PROPERTY_ROLE_GUARD = 5;
  PROPERTY_ROLE_GUEST = 6;
}

message PropertyRoleAssignment {
  string assignment_id = 1;
  string property_id = 2;
  string subject_player_id = 3;
  PropertyRole role = 4;
  string granted_by_player_id = 5;
  uint64 created_at_ms = 6;
  uint64 expires_at_ms = 7;
  // Delegation provenance. Removing or expiring this assignment also
  // invalidates every role derived from it.
  string granted_by_assignment_id = 8;
}

message PropertyLedger {
  uint32 schema = 1;
  uint64 revision = 2;
  repeated PropertyRoleAssignment assignments = 3;
}

message PropertyHomeMarker {
  string property_id = 1;
  string level_id = 2;
  string display_name = 3;
  Vec3 position = 4;
  uint64 entity_guid = 5;
  PropertyRole role = 6;
}

message ServerAccepted {
  uint64 player_id = 1;
  string resume_token = 2;
  uint32 tick_rate = 3;
  uint32 snapshot_rate = 4;
  uint32 max_players = 5;
  string server_name = 6;
  string level_id = 7;
  repeated PlayerSnapshot players = 8;
  uint32 profile_snapshot_interval_seconds = 9;
  AvatarPolicy avatar_policy = 10;
  PropertyHomeMarker home_marker = 11;
}

message ServerHomeMarkerUpdated {
  PropertyHomeMarker marker = 1;
  bool active = 2;
  uint64 ledger_revision = 3;
}

message ServerRejected {
  RejectReason reason = 1;
  string message = 2;
}

message PlayerJoined {
  PlayerSnapshot player = 1;
}

message PlayerLeft {
  uint64 player_id = 1;
  string reason = 2;
}

message ClientTransform {
  TransformState transform = 1;
}

message WorldSnapshot {
  uint64 server_tick = 1;
  uint64 server_time_ms = 2;
  repeated PlayerSnapshot players = 3;
  EnvironmentState environment = 4;
}

message ServerEnvironmentUpdated {
  EnvironmentState state = 1;
}

message ClientSleepState {
  bool sleeping = 1;
}

message ServerSleepState {
  uint64 revision = 1;
  uint32 sleeping_players = 2;
  uint32 required_players = 3;
  bool time_skipped = 4;
}

message ClientDeath {
}

message ClientRespawnRequest {
}

message ServerRespawn {
  TransformState spawn = 1;
}

message ClientActivityStart {
  PlayerActivityKind kind = 1;
  uint64 station_guid = 2;
}

message ClientActivityEnd {
  uint64 session_id = 1;
  TransformState final_transform = 2;
}

message ActivityGranted {
  PlayerActivity activity = 1;
}

message ActivityDenied {
  PlayerActivityKind kind = 1;
  uint64 station_guid = 2;
  string reason = 3;
}

message PlayerActivityUpdated {
  uint64 player_id = 1;
  PlayerActivity activity = 2;
  TransformState final_transform = 3;
}

message StateCorrection {
  TransformState accepted_transform = 1;
  string reason = 2;
}

message ChatSend {
  string text = 1;
}

message ChatBroadcast {
  uint64 player_id = 1;
  string display_name = 2;
  string text = 3;
  uint64 server_time_ms = 4;
}

message Ping {
  uint64 nonce = 1;
  uint64 client_time_ms = 2;
}

message Pong {
  uint64 nonce = 1;
  uint64 client_time_ms = 2;
  uint64 server_time_ms = 3;
}

message ServerShutdown {
  string reason = 1;
}

message ServerEntityControl {
  // Legacy aggregate: true only when both categories are disabled. New peers
  // use the presence-aware category fields below.
  bool non_player_entities_disabled = 1;
  optional bool human_npcs_disabled = 2;
  optional bool animal_npcs_disabled = 3;
}

enum NpcKind {
  NPC_KIND_UNSPECIFIED = 0;
  NPC_KIND_HUMAN = 1;
  NPC_KIND_ANIMAL = 2;
}

enum NpcBehaviorIntent {
  NPC_BEHAVIOR_UNSPECIFIED = 0;
  NPC_BEHAVIOR_IDLE = 1;
  NPC_BEHAVIOR_TRAVEL = 2;
  NPC_BEHAVIOR_INVESTIGATE = 3;
  NPC_BEHAVIOR_COMBAT = 4;
  NPC_BEHAVIOR_FLEE = 5;
  NPC_BEHAVIOR_DIALOGUE = 6;
  NPC_BEHAVIOR_DEAD = 7;
}

message NpcAggroEntry {
  uint64 player_id = 1;
  float value = 2;
}

message NpcCombatResult {
  uint64 event_id = 1;
  uint64 attacker_player_id = 2;
  float health_damage = 3;
  float stamina_damage = 4;
  bool fatal = 5;
}

message NpcInventoryState {
  uint64 revision = 1;
  repeated InventoryItem items = 2;
}

// Dialogue replication deliberately carries stable session/phase state instead
// of engine pointers. Peers can display and gate the same conversation without
// serialising process-local dialogue objects.
message NpcDialogState {
  uint64 revision = 1;
  uint64 session_id = 2;
  int32 phase = 3;
  bool active = 4;
  uint64 speaking_player_id = 5;
}

message NpcGameplayState {
  uint64 revision = 1;
  float health = 2;
  float max_health = 3;
  bool dead = 4;
  NpcBehaviorIntent behavior = 5;
  uint64 combat_target_player_id = 6;
  repeated NpcAggroEntry aggro = 7;
  NpcInventoryState inventory = 8;
  NpcDialogState dialog = 9;
  NpcCombatResult last_combat_result = 10;
  Vec3 behavior_target = 11;
  float desired_speed = 12;
}

// A game-thread observation of an authored NPC already loaded by KCD2. The
// authored GUID is the stable identity shared by the level catalog and every
// client; runtime entity ids are deliberately never sent over the network.
message NpcObservation {
  uint64 authored_guid = 1;
  NpcKind kind = 2;
  TransformState transform = 3;
  NpcGameplayState gameplay = 4;
  // Runtime-spawned actors do not have a cross-machine authored GUID. The
  // creator's GUID is only a discovery token; the server assigns npc_id.
  bool dynamic = 5;
  string entity_class = 6;
  string entity_name = 7;
  uint64 known_npc_id = 8;
}

message ClientNpcDiscovery {
  repeated NpcObservation observations = 1;
}

message NpcState {
  uint64 npc_id = 1;
  uint32 generation = 2;
  uint64 authored_guid = 3;
  NpcKind kind = 4;
  TransformState transform = 5;
  uint64 revision = 6;
  uint64 authority_player_id = 7;
  uint64 lease_id = 8;
  NpcGameplayState gameplay = 9;
  bool dynamic = 10;
  string entity_class = 11;
  string entity_name = 12;
}

message ClientNpcUpdate {
  uint64 npc_id = 1;
  uint32 generation = 2;
  uint64 lease_id = 3;
  TransformState transform = 4;
  NpcGameplayState gameplay = 5;
}

// Authority reports share one sampling instant and are batched to avoid one
// transport packet per NPC. Individual ClientNpcUpdate remains accepted for
// protocol diagnostics and rolling upgrades.
message ClientNpcUpdateBatch {
  repeated ClientNpcUpdate updates = 1;
}

message ServerNpcEnter {
  NpcState state = 1;
}

message ServerNpcLeave {
  uint64 npc_id = 1;
  uint32 generation = 2;
}

message ServerNpcAuthority {
  uint64 npc_id = 1;
  uint32 generation = 2;
  uint64 authority_player_id = 3;
  uint64 lease_id = 4;
}

message ServerNpcSnapshot {
  uint64 server_tick = 1;
  repeated NpcState npcs = 2;
}

// High-frequency absolute motion recovery. Lifecycle, authority and gameplay
// are deliberately kept out of this unreliable stream.
message NpcMotionState {
  uint64 npc_id = 1;
  uint32 generation = 2;
  uint64 revision = 3;
  TransformState transform = 4;
}

message ServerNpcMotion {
  uint64 server_tick = 1;
  repeated NpcMotionState npcs = 2;
}

// Revisioned gameplay is reliable and independent from the lossy motion
// stream. Inventory may be omitted when its own revision did not change.
message ServerNpcGameplayUpdate {
  uint64 npc_id = 1;
  uint32 generation = 2;
  uint64 state_revision = 3;
  NpcGameplayState gameplay = 4;
}

message ClientAvatarUpdate {
  uint64 base_revision = 1;
  AvatarDescriptor avatar = 2;
}

message AvatarAccepted {
  uint64 revision = 1;
}

message AvatarRejected {
  AvatarDescriptor authoritative_avatar = 1;
  string reason = 2;
}

message PlayerAvatarUpdated {
  uint64 player_id = 1;
  AvatarDescriptor avatar = 2;
}

message Envelope {
  oneof payload {
    ClientHello client_hello = 1;
    ServerAccepted server_accepted = 2;
    ServerRejected server_rejected = 3;
    PlayerJoined player_joined = 4;
    PlayerLeft player_left = 5;
    ClientTransform client_transform = 6;
    WorldSnapshot world_snapshot = 7;
    StateCorrection state_correction = 8;
    ChatSend chat_send = 9;
    ChatBroadcast chat_broadcast = 10;
    Ping ping = 11;
    Pong pong = 12;
    ServerShutdown server_shutdown = 13;
    ServerChallenge server_challenge = 14;
    ClientAuthenticate client_authenticate = 15;
    ServerBootstrap server_bootstrap = 16;
    ClientWorldReady client_world_ready = 17;
    ClientWorldFailed client_world_failed = 18;
    ClientProfileUpdate client_profile_update = 19;
    ProfileAccepted profile_accepted = 20;
    ProfileRejected profile_rejected = 21;
    ServerEntityControl server_entity_control = 22;
    ClientAvatarUpdate client_avatar_update = 23;
    AvatarAccepted avatar_accepted = 24;
    AvatarRejected avatar_rejected = 25;
    PlayerAvatarUpdated player_avatar_updated = 26;
    ClientWorldObjectUpdate client_world_object_update = 27;
    WorldObjectAccepted world_object_accepted = 28;
    WorldObjectRejected world_object_rejected = 29;
    WorldObjectUpdated world_object_updated = 30;
    ServerEnvironmentUpdated server_environment_updated = 31;
    ClientWorldItemUpdate client_world_item_update = 32;
    WorldItemAccepted world_item_accepted = 33;
    WorldItemRejected world_item_rejected = 34;
    WorldItemUpdated world_item_updated = 35;
    ClientSleepState client_sleep_state = 36;
    ServerSleepState server_sleep_state = 37;
    ClientDeath client_death = 38;
    ClientRespawnRequest client_respawn_request = 39;
    ServerRespawn server_respawn = 40;
    ClientActivityStart client_activity_start = 41;
    ClientActivityEnd client_activity_end = 42;
    ActivityGranted activity_granted = 43;
    ActivityDenied activity_denied = 44;
    PlayerActivityUpdated player_activity_updated = 45;
    ServerHomeMarkerUpdated server_home_marker_updated = 46;
    ClientNpcDiscovery client_npc_discovery = 47;
    ClientNpcUpdate client_npc_update = 48;
    ServerNpcEnter server_npc_enter = 49;
    ServerNpcLeave server_npc_leave = 50;
    ServerNpcAuthority server_npc_authority = 51;
    ServerNpcSnapshot server_npc_snapshot = 52;
    ClientNpcUpdateBatch client_npc_update_batch = 53;
    ServerNpcMotion server_npc_motion = 54;
    ServerNpcGameplayUpdate server_npc_gameplay_update = 55;
  }
}
